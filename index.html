<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>까돌이의 편의점 물질 분류 게임</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Nanum Gothic', 'Malgun Gothic', sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f0f4f8;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 1024px;
            max-height: 768px;
            margin: 0 auto;
            background: linear-gradient(to bottom, #e0f2fe 0%, #ffffff 80%);
            border: 4px solid #3b82f6;
            overflow: hidden;
        }

        /* 메인 시작 화면 */
        #start-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #start-screen h1 {
            font-size: 2.2rem;
            color: #1e3a8a;
            margin-bottom: 10px;
            text-align: center;
        }

        #start-screen p {
            font-size: 1.2rem;
            color: #4b5563;
            margin-bottom: 30px;
            text-align: center;
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            background-color: #2563eb;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.2s;
        }

        .btn:hover {
            background-color: #1d4ed8;
            transform: scale(1.05);
        }

        /* 상단 상태 바 */
        #header {
            position: absolute;
            top: 0; left: 0; width: 100%;
            height: 60px;
            background-color: #1e293b;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 1.2rem;
            font-weight: bold;
            z-index: 10;
        }

        .badge {
            background: #3b82f6;
            padding: 5px 15px;
            border-radius: 20px;
        }

        /* 게임 영역 */
        #play-area {
            position: absolute;
            top: 60px;
            left: 0;
            width: 100%;
            height: calc(100% - 200px);
        }

        /* 떨어지는 물체 */
        .falling-item {
            position: absolute;
            width: 110px;
            height: 110px;
            background: white;
            border: 3px solid #3b82f6;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: grab;
            box-shadow: 0 8px 15px rgba(0,0,0,0.15);
            touch-action: none;
            z-index: 20;
        }

        .falling-item:active {
            cursor: grabbing;
            transform: scale(1.1);
        }

        .falling-item .icon {
            font-size: 2.5rem;
            margin-bottom: 5px;
        }

        .falling-item .name {
            font-size: 0.95rem;
            font-weight: bold;
            color: #1f2937;
            text-align: center;
        }

        /* 오답 X 표시 */
        .wrong-mark {
            position: absolute;
            font-size: 5rem;
            color: #ef4444;
            font-weight: bold;
            pointer-events: none;
            animation: fadeOut 0.6s forwards;
            z-index: 30;
        }

        @keyframes fadeOut {
            0% { opacity: 1; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0; transform: scale(1); }
        }

        /* 하단 바구니 영역 */
        #basket-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 140px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px;
            background: #f1f5f9;
            border-top: 3px solid #cbd5e1;
        }

        .basket {
            width: 18%;
            height: 110px;
            background: white;
            border: 3px dashed #64748b;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
        }

        .basket.hover {
            border-color: #2563eb;
            background-color: #eff6ff;
            transform: scale(1.05);
        }

        .basket .b-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #0f172a;
            margin-bottom: 5px;
        }

        .basket .b-count {
            font-size: 0.9rem;
            color: #64748b;
        }

        /* 단계 안내 팝업 */
        #stage-modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 90;
        }

        #stage-modal h2 { font-size: 2.5rem; color: #fde047; margin-bottom: 10px; }
        #stage-modal p { font-size: 1.3rem; }

        /* 결과 화면 */
        #result-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #result-screen h1 { font-size: 3rem; color: #16a34a; margin-bottom: 20px; }
        #result-screen p { font-size: 1.5rem; color: #374151; margin-bottom: 30px; }
    </style>
</head>
<body>

<div id="game-container">
    <!-- 메인 화면 -->
    <div id="start-screen">
        <h1>🏪 까돌이의 편의점 물질 분류</h1>
        <p>하늘에서 떨어지는 물체를 올바른 물질 상자로 옮겨주세요!</p>
        <button class="btn" onclick="startGame()">게임 시작하기</button>
    </div>

    <!-- 헤더 (상태창) -->
    <div id="header">
        <div class="badge" id="level-badge">1단계</div>
        <div>남은 물체: <span id="remaining-count">0</span>개</div>
        <div>점수: <span id="score-display">0</span>점</div>
    </div>

    <!-- 떨어지는 영역 -->
    <div id="play-area"></div>

    <!-- 하단 물질 바구니 -->
    <div id="basket-container">
        <div class="basket" data-type="나무">
            <div class="b-title">🪵 나무</div>
            <div class="b-count">수집: <span id="count-나무">0</span></div>
        </div>
        <div class="basket" data-type="철">
            <div class="b-title">⚙️ 철</div>
            <div class="b-count">수집: <span id="count-철">0</span></div>
        </div>
        <div class="basket" data-type="유리">
            <div class="b-title">🥛 유리</div>
            <div class="b-count">수집: <span id="count-유리">0</span></div>
        </div>
        <div class="basket" data-type="플라스틱">
            <div class="b-title">🥤 플라스틱</div>
            <div class="b-count">수집: <span id="count-플라스틱">0</span></div>
        </div>
        <div class="basket" data-type="고무">
            <div class="b-title">🎈 고무</div>
            <div class="b-count">수집: <span id="count-고무">0</span></div>
        </div>
    </div>

    <!-- 단계 통과 모달 -->
    <div id="stage-modal">
        <h2 id="modal-title">1단계 성공!</h2>
        <p>잠시 후 다음 단계가 시작됩니다...</p>
    </div>

    <!-- 게임 완료 화면 -->
    <div id="result-screen">
        <h1>🎉 미션을 성공하였습니다!</h1>
        <p>까돌이를 도와 편의점 물건들을 완벽하게 분류했습니다!</p>
        <button class="btn" onclick="location.reload()">다시 하기</button>
    </div>
</div>

<script>
    // 전체 물체 데이터베이스 (20종, 띄어쓰기 교정 완료)
    const itemsDB = [
        { name: '나무 연필', type: '나무', icon: '✏️' },
        { name: '나무 책상', type: '나무', icon: '🪵' },
        { name: '나무 도마', type: '나무', icon: '🪵' },
        { name: '나무 숟가락', type: '나무', icon: '🥄' },
        { name: '나무 젓가락', type: '나무', icon: '🥢' },

        { name: '철 집게', type: '철', icon: '✂️' },
        { name: '손톱깎이', type: '철', icon: '✂️' },
        { name: '철 클립', type: '철', icon: '📎' },
        { name: '음료수 캔', type: '철', icon: '🥫' },

        { name: '유리컵', type: '유리', icon: '🥛' },
        { name: '유리 어항', type: '유리', icon: '🏺' },
        { name: '유리구슬', type: '유리', icon: '🔮' },
        { name: '유리병', type: '유리', icon: '🍾' },

        { name: '플라스틱 자', type: '플라스틱', icon: '📏' },
        { name: '플라스틱 장난감', type: '플라스틱', icon: '🧸' },
        { name: '페트병', type: '플라스틱', icon: '🧴' },
        { name: '플라스틱 그릇', type: '플라스틱', icon: '🥣' },

        { name: '고무줄', type: '고무', icon: '🔴' },
        { name: '고무장갑', type: '고무', icon: '🧤' },
        { name: '지우개', type: '고무', icon: '🧽' }
    ];

    // 단계별 설정 (1~5단계, 총 4분 내외 플레이)
    const stageConfigs = [
        { level: 1, itemCount: 8, speed: 1.2, spawnInterval: 3000 },
        { level: 2, itemCount: 12, speed: 1.8, spawnInterval: 2500 },
        { level: 3, itemCount: 16, speed: 2.3, spawnInterval: 2200 },
        { level: 4, itemCount: 20, speed: 2.8, spawnInterval: 1900 },
        { level: 5, itemCount: 24, speed: 3.4, spawnInterval: 1600 }
    ];

    let currentStageIndex = 0;
    let score = 0;
    let remainingStageItems = [];
    let activeItem = null;
    let animFrameId = null;
    let spawnTimerId = null;
    let isDragging = false;
    let dragOffset = { x: 0, y: 0 };
    let counts = { '나무': 0, '철': 0, '유리': 0, '플라스틱': 0, '고무': 0 };

    const playArea = document.getElementById('play-area');

    // 배열을 무작위로 섞는 함수 (피셔-예이츠 셔플)
    function shuffleArray(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function startGame() {
        document.getElementById('start-screen').style.display = 'none';
        currentStageIndex = 0;
        score = 0;
        updateScore(0);
        loadStage(currentStageIndex);
    }

    function loadStage(index) {
        cleanUp();
        
        if (index >= stageConfigs.length) {
            showResult();
            return;
        }

        const config = stageConfigs[index];
        document.getElementById('level-badge').innerText = `${config.level}단계`;
        
        // ✨ 핵심 변경 사항: 중복 없는 무작위 큐 생성
        // itemsDB의 20개 물체를 겹치지 않게 섞어서 해당 단계 개수만큼 뽑아 큐에 넣습니다.
        let shuffledList = shuffleArray(itemsDB);
        
        // 20개가 넘어가는 단계(4~5단계)는 20개 소비 후 다시 섞어서 채웁니다.
        remainingStageItems = [];
        while (remainingStageItems.length < config.itemCount) {
            if (shuffledList.length === 0) {
                shuffledList = shuffleArray(itemsDB);
            }
            remainingStageItems.push(shuffledList.pop());
        }

        document.getElementById('remaining-count').innerText = remainingStageItems.length;

        // 일정 간격으로 물체 투하 시작
        spawnNextItem();
        spawnTimerId = setInterval(() => {
            if (!activeItem && remainingStageItems.length > 0) {
                spawnNextItem();
            }
        }, config.spawnInterval);
    }

    function spawnNextItem() {
        if (remainingStageItems.length === 0 || activeItem) return;

        // 중복 없이 섞인 목록에서 하나씩 꺼냅니다 (pop)
        const itemData = remainingStageItems.pop();
        document.getElementById('remaining-count').innerText = remainingStageItems.length;

        const el = document.createElement('div');
        el.className = 'falling-item';
        el.innerHTML = `<div class="icon">${itemData.icon}</div><div class="name">${itemData.name}</div>`;
        el.dataset.type = itemData.type;
        el.dataset.name = itemData.name;

        // X 위치 랜덤
        const maxLeft = playArea.clientWidth - 120;
        const randomLeft = Math.max(10, Math.floor(Math.random() * maxLeft));
        
        el.style.left = randomLeft + 'px';
        el.style.top = '0px';

        playArea.appendChild(el);
        activeItem = {
            element: el,
            type: itemData.type,
            posY: 0,
            posX: randomLeft,
            speed: stageConfigs[currentStageIndex].speed
        };

        initDragEvents(el);
        animateItem();
    }

    function animateItem() {
        if (!activeItem || isDragging) return;

        activeItem.posY += activeItem.speed;
        activeItem.element.style.top = activeItem.posY + 'px';

        // 바닥에 닿은 경우 (놓침)
        const maxTop = playArea.clientHeight - 110;
        if (activeItem.posY >= maxTop) {
            showWrongEffect(activeItem.posX + 30, maxTop);
            removeItem();
            checkStageProgress();
            return;
        }

        animFrameId = requestAnimationFrame(animateItem);
    }

    // 드래그 & 터치 이벤트
    function initDragEvents(el) {
        const startDrag = (clientX, clientY) => {
            isDragging = true;
            cancelAnimationFrame(animFrameId);
            const rect = el.getBoundingClientRect();
            dragOffset.x = clientX - rect.left;
            dragOffset.y = clientY - rect.top;
        };

        const moveDrag = (clientX, clientY) => {
            if (!isDragging || !activeItem) return;
            const containerRect = document.getElementById('game-container').getBoundingClientRect();
            
            let newX = clientX - containerRect.left - dragOffset.x;
            let newY = clientY - containerRect.top - dragOffset.y - 60; // Header offset

            el.style.left = newX + 'px';
            el.style.top = newY + 'px';
            activeItem.posX = newX;
            activeItem.posY = newY;
        };

        const endDrag = (clientX, clientY) => {
            if (!isDragging) return;
            isDragging = false;

            // 드롭 판정
            const baskets = document.querySelectorAll('.basket');
            let dropped = false;

            baskets.forEach(basket => {
                const rect = basket.getBoundingClientRect();
                if (
                    clientX >= rect.left && clientX <= rect.right &&
                    clientY >= rect.top && clientY <= rect.bottom
                ) {
                    dropped = true;
                    const targetType = basket.dataset.type;
                    if (targetType === activeItem.type) {
                        // 정답!
                        score += 10;
                        updateScore(score);
                        counts[targetType]++;
                        document.getElementById(`count-${targetType}`).innerText = counts[targetType];
                        removeItem();
                    } else {
                        // 오답!
                        showWrongEffect(activeItem.posX + 30, activeItem.posY);
                        removeItem();
                    }
                }
            });

            if (!dropped) {
                // 상자 밖에 떨어뜨린 경우 낙하 계속
                animateItem();
            } else {
                checkStageProgress();
            }
        };

        // 마우스 이벤트
        el.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY));
        window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
        window.addEventListener('mouseup', (e) => endDrag(e.clientX, e.clientY));

        // 터치 이벤트 (태블릿/모바일)
        el.addEventListener('touchstart', (e) => {
            const t = e.touches[0];
            startDrag(t.clientX, t.clientY);
        });
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                const t = e.touches[0];
                moveDrag(t.clientX, t.clientY);
            }
        });
        window.addEventListener('touchend', (e) => {
            if (e.changedTouches.length > 0) {
                const t = e.changedTouches[0];
                endDrag(t.clientX, t.clientY);
            }
        });
    }

    function showWrongEffect(x, y) {
        const mark = document.createElement('div');
        mark.className = 'wrong-mark';
        mark.innerText = '❌';
        mark.style.left = x + 'px';
        mark.style.top = y + 'px';
        playArea.appendChild(mark);
        setTimeout(() => mark.remove(), 600);
    }

    function removeItem() {
        if (activeItem && activeItem.element) {
            activeItem.element.remove();
        }
        activeItem = null;
    }

    function checkStageProgress() {
        if (remainingStageItems.length === 0 && !activeItem) {
            cleanUp();
            const modal = document.getElementById('stage-modal');
            document.getElementById('modal-title').innerText = `${stageConfigs[currentStageIndex].level}단계 완료!`;
            modal.style.display = 'flex';

            setTimeout(() => {
                modal.style.display = 'none';
                currentStageIndex++;
                loadStage(currentStageIndex);
            }, 1800);
        } else {
            setTimeout(spawnNextItem, 500);
        }
    }

    function updateScore(val) {
        document.getElementById('score-display').innerText = val;
    }

    function cleanUp() {
        clearInterval(spawnTimerId);
        cancelAnimationFrame(animFrameId);
        removeItem();
    }

    function showResult() {
        document.getElementById('result-screen').style.display = 'flex';
    }
</script>
</body>
</html>
